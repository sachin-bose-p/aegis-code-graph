[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aegis-code-graph"
version = "0.2.0"
description = "Lightweight local-first repository-to-architecture diagram engine"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = [
    "pydantic>=2.10.0",
    "openai>=1.50.0",
    "pathspec>=0.12.0",
    "tree-sitter>=0.26.0",
    "tree-sitter-language-pack>=1.20.0",
]

[project.optional-dependencies]
api = [
    "fastapi>=0.115.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
]

[project.scripts]
aegis-graph = "aegis_code_graph.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/aegis_code_graph"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
